{% extends 'base.html' %}
{% block title %}Erro {{ code }}{% endblock %}

{% block content %}
  <section class="panel error-page">
    <div class="empty-state">
      <p class="eyebrow">Erro {{ code }}</p>
      <h1>Não foi possível concluir</h1>
      <p>{{ message }}</p>
      <div class="actions">
        <a class="btn btn-primary" href="{{ url_for('index') }}">{{ ui.icon('arrow-left') }} Voltar ao início</a>
      </div>
    </div>
  </section>
{% endblock %}
